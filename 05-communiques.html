<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette 5 – Communiqués financiers</title>
<style>
  :root { --ink: #1f2329; --muted: #6b7280; --line: #e5e7eb; --red: #b5121b; --bg: #ffffff; --soft: #f5f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); padding-bottom: 76px; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; position: sticky; top: 0; background: rgba(255,255,255,.97); z-index: 5; border-bottom: 1px solid var(--line); }
  header img { height: 40px; }
  header .hello { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.3; }
  header .hello b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .ic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
  .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  section { padding: 18px 20px 0; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Dernier communiqué */
  .latest { margin-top: 16px; background: #1f2329; color: #fff; border-radius: 6px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; }
  .latest img { width: 92px; aspect-ratio: 527 / 760; object-fit: cover; background: #fff; border-radius: 2px; flex-shrink: 0; }
  .doc img.ph { object-fit: cover; object-position: top; }
  .latest .k { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #f87171; font-weight: 600; }
  .latest .t { font-size: 16px; font-weight: 600; line-height: 1.3; margin-top: 6px; }
  .latest .d { font-size: 12px; opacity: .7; margin-top: 6px; }
  .latest .btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; background: var(--red); color: #fff; padding: 10px 14px; border-radius: 4px; font-size: 13px; font-weight: 500; }
  .latest .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* Alerte nouvelles publications */
  .alert { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; }
  .alert svg { width: 20px; height: 20px; stroke: var(--red); fill: none; stroke-width: 1.6; flex-shrink: 0; }
  .alert .t { flex: 1; font-size: 13px; line-height: 1.35; }
  .alert .t small { display: block; color: var(--muted); font-size: 11px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; background: #d1d5db; position: relative; cursor: pointer; flex-shrink: 0; border: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.on { background: var(--red); } .switch.on::after { left: 21px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
  .chip { flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 13px; border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .year { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 22px 0 4px; font-weight: 600; }
  .doc { display: flex; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .doc .ph { width: 42px; height: 54px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--red); font-weight: 600; flex-shrink: 0; }
  .doc .k { font-size: 10px; color: var(--red); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .doc .t { font-size: 14px; font-weight: 500; line-height: 1.35; margin-top: 2px; }
  .doc .d { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .doc .dl { margin-left: auto; color: var(--red); flex-shrink: 0; }
  .doc .dl svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .more { display: block; text-align: center; margin: 18px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; color: var(--red); font-weight: 500; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 5; }
  nav a { flex: 1; text-align: center; padding: 9px 0 12px; font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  nav svg { display: block; margin: 0 auto 3px; width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav a.on { color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <img src="https://www.colorado.ma/corporate/sites/default/files/logo_soyezinspires_02.png" alt="Colorado">
    <div class="hello">Espace Corporate<b>Communiqués financiers</b></div>
    <a class="ic" href="#" title="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg></a>
  </header>

  <section>
    <h1>Communiqués financiers</h1>
    <div class="sub">Résultats, indicateurs et assemblées générales</div>

    <div class="latest" id="latest"></div>

    <div class="alert">
      <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg>
      <div class="t">Être alerté des nouvelles publications<small>Une notification à chaque nouveau communiqué</small></div>
      <button class="switch" id="sw" aria-label="Activer les alertes"></button>
    </div>

    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <a class="more" href="#">Voir les communiqués plus anciens</a>
  </section>

  <nav>
    <a href="02-accueil.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>Accueil</a>
    <a href="03-actualites.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Actualités</a>
    <a href="04-rapports.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>Rapports</a>
    <a class="on" href="05-communiques.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Communiqués</a>
    <a href="06-contact.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>Contact</a>
  </nav>
</div>
<script>
  // Communiqués publiés sur colorado.ma/corporate/fr/communiques-financiers
  const D = "https://www.colorado.ma/corporate/sites/default/files/documents/";
  const P = "https://www.colorado.ma/corporate/sites/default/files/photos/"; // aperçus fournis par le site
  const CF = [
    { d: "2026-09-25", k: "Semestriel", t: "Communication financière semestrielle au 30-06-2026", f: "communication_financiere_semestrielle_au_30-06-2026.pdf", p: "communication_financiere_semestrielle_au_30-06-2026.png" },
    { d: "2026-05-18", k: "Assemblée générale", t: "Communiqué post AGO du 15/05/2026", f: "communique_post_ago_du_15-05-2026.pdf", p: "communique_post_ago_du_15-05-2026.png" },
    { d: "2026-04-09", k: "Résultats annuels", t: "Communiqué financier annuel 2025 : résultats annuels", f: "communique_financier_des_resultats_annuels_2025.pdf", p: "image_communique_annuel_2025_1.png" },
    { d: "2026-03-10", k: "Résultats annuels", t: "Communiqué financier : résultats annuels 2025", f: "cfa-resultats_2025.pdf", p: "cfa-2025.png" },
    { d: "2025-09-22", k: "Semestriel", t: "Communication financière semestrielle au 30-06-2025", f: "communication_financiere_2025_vf_au_30-06-2025.pdf", p: "com30062025.jpg" },
    { d: "2025-05-19", k: "Assemblée générale", t: "Communiqué post AGO du 15/05/2025", f: "colorado_cp_ago_15052025_0.pdf", p: "cp_ago_15-05-2025_0.png" },
    { d: "2025-04-28", k: "Résultats annuels", t: "Communiqué financier annuel 2024 : résultats annuels", f: "cf_rfa_2024.pdf", p: "ig_cf_rf_2024.png" },
    { d: "2025-03-20", k: "Résultats annuels", t: "Communiqué financier : résultats annuels 2024", f: "cf_p-ca_2024.pdf", p: "img_cf_ca_180325.png" },
    { d: "2025-02-18", k: "Indicateurs trimestriels", t: "Indicateurs trimestriels : T4-2024", f: "exe_communique_de_presse_t4_2024.pdf", p: "com_indt4_2024.png" },
    { d: "2024-11-15", k: "Indicateurs trimestriels", t: "Indicateurs trimestriels : T3-2024", f: "cf_ind_t3_2024.pdf", p: "ind_t3_2024.png" }
  ];
  const fmt = s => new Date(s).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  const DL = `<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`;
  let type = "Tous";

  const l = CF[0];
  document.getElementById("latest").innerHTML = `<img src="${P + l.p}" alt="Aperçu du communiqué"><div>
    <div class="k">Dernière publication · ${l.k}</div><div class="t">${l.t}</div>
    <div class="d">Publié le ${fmt(l.d)}</div><a class="btn" href="${D + l.f}">${DL}Télécharger</a></div>`;

  function render() {
    let html = "", year = "";
    CF.slice(1).filter(c => type === "Tous" || c.k === type).forEach(c => {
      const y = c.d.slice(0, 4);
      if (y !== year) { html += `<div class="year">${y}</div>`; year = y; }
      html += `<a class="doc" href="${D + c.f}"><img class="ph" src="${P + c.p}" alt="" loading="lazy">
        <div><div class="k">${c.k}</div><div class="t">${c.t}</div><div class="d">${fmt(c.d)}</div></div><span class="dl">${DL}</span></a>`;
    });
    document.getElementById("list").innerHTML = html;
    const types = ["Tous", ...new Set(CF.map(c => c.k))];
    document.getElementById("chips").innerHTML = types.map(t => `<button class="chip ${t === type ? "on" : ""}" data-t="${t}">${t}</button>`).join("");
  }
  document.addEventListener("click", e => { const c = e.target.closest("[data-t]"); if (c) { type = c.dataset.t; render(); } });
  document.getElementById("sw").onclick = e => e.currentTarget.classList.toggle("on");
  render();
</script>
</body>
</html>
