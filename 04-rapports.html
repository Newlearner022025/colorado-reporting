<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="images/icone-192.png">
<link rel="apple-touch-icon" href="images/icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colorado">
<title data-t>Colorado Reporting – Rapports</title>
<style>
  :root { --ink: #1f2329; --muted: #6b7280; --line: #e5e7eb; --red: #b5121b; --bg: #ffffff; --soft: #f5f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); padding-bottom: 76px; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; position: sticky; top: 0; background: rgba(255,255,255,.97); z-index: 5; border-bottom: 1px solid var(--line); }
  header img { height: 40px; }
  header .hello { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.3; }
  header .hello b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .ic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
  .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  section { padding: 18px 20px 0; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  h2 { margin: 26px 0 12px; font-size: 17px; font-weight: 600; }

  /* Sélecteur à deux boutons : l'onglet choisi ressort en blanc, l'autre reste grisé mais clairement cliquable */
  .tabs { display: flex; gap: 4px; margin-top: 16px; padding: 4px; background: #ebebea; border-radius: 8px; }
  .tabs button { flex: 1; white-space: nowrap; border: none; border-radius: 6px; padding: 10px 6px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--red); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pane { display: none; } .pane.on { display: block; }
  .rep .ty { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 13px; border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .more { display: block; width: 100%; margin: 18px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 14px; color: var(--red); font-weight: 500; cursor: pointer; }
  .more[hidden] { display: none; }

  /* Dernier rapport */
  .latest { display: flex; gap: 16px; margin-top: 18px; padding: 16px; background: var(--soft); border-radius: 6px; }
  .latest img { width: 116px; height: auto; aspect-ratio: 707 / 1000; object-fit: cover; box-shadow: 0 6px 18px rgba(0,0,0,.18); flex-shrink: 0; background: #fff; }
  .latest .k { font-size: 10px; color: var(--red); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .latest .t { font-size: 18px; font-weight: 600; line-height: 1.3; margin-top: 4px; }
  .latest .s { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: 500; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .btn.main { background: var(--red); color: #fff; }
  .btn.alt { border: 1px solid var(--ink); }

  /* Archives */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
  .rep img { width: 100%; aspect-ratio: 707 / 1000; object-fit: cover; display: block; border: 1px solid var(--line); background: var(--soft); }
  .rep .y { font-size: 14px; font-weight: 600; margin-top: 8px; }
  .rep .s { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .rep .s svg { width: 12px; height: 12px; stroke: var(--red); fill: none; stroke-width: 2; }

  .doc { display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
  .doc .ph { width: 46px; height: 62px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--red); font-weight: 600; flex-shrink: 0; }
  .doc .t { font-size: 14px; font-weight: 500; line-height: 1.35; }
  .doc .s { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .doc .dl { margin-left: auto; color: var(--red); flex-shrink: 0; }
  .doc .dl svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 18px; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 5; }
  nav a { flex: 1; text-align: center; padding: 9px 0 12px; font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  nav svg { display: block; margin: 0 auto 3px; width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav a.on { color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <a data-t href="01-demarrage.html" title="Revenir à l'écran de démarrage"><img src="https://www.colorado.ma/corporate/sites/default/files/logo_soyezinspires_02.png" alt="Colorado"></a>
    <div class="hello" data-t>Espace Corporate<b data-t>Rapports annuels</b></div>
  </header>

  <section>
    <h1 data-t>Rapports</h1>
    <div class="sub" data-t>Rapports annuels et rapports financiers de chaque exercice</div>

    <div class="tabs">
      <button class="on" data-p="annuels" data-t>Rapports annuels</button>
      <button data-p="financiers" data-t>Rapports financiers</button>
    </div>

    <div class="pane on" id="annuels">
      <div class="latest" id="latest"></div>

      <h2 data-t>Éditions précédentes</h2>
      <div class="grid" id="grid"></div>
    </div>

    <div class="pane" id="financiers">
      <div class="chips" id="chipsRF"></div>
      <h2 id="titreRF" data-t>Rapports financiers</h2>
      <div class="grid" id="gridRF"></div>
      <button class="more" id="moreRF" hidden data-t>Voir les rapports plus anciens</button>
      <p class="note" data-t>Documents publiés sur l'espace Corporate de colorado.ma (rubrique États financiers).</p>
    </div>
  </section>

  <nav>
    <a data-t href="02-accueil.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>Accueil</a>
    <a data-t href="03-actualites.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Actualités</a>
    <a data-t class="on" href="04-rapports.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>Rapports</a>
    <a data-t href="05-communiques.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Communiqués</a>
    <a data-t href="06-contact.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>Contact</a>
  </nav>
</div>
<script src="donnees.js"></script>
<script>
  // Rapports de départ, remplacés par data/contenus.json dès qu'il est chargé
  const D = "https://www.colorado.ma/corporate/sites/default/files/documents/";
  const { esc, T } = Donnees;
  let REPORTS = [
    { y: 2025, mo: 6.6, pdf: D + "exe_final_rapport_annuel_2025_version_fr_non_vectorise_avec_correction_22052026.pdf" },
    { y: 2024, mo: 10.6, pdf: D + "rapport_annuel_2024.pdf" },
    { y: 2023, mo: 16.9, pdf: D + "rap_ann_fr.pdf", img: "https://www.colorado.ma/corporate/sites/default/files/photos/rapp_ann_fr.jpg" },
    { y: 2022, mo: 12.5, pdf: D + "rapport_annuel.pdf" },
    { y: 2021, mo: 8.4, pdf: D + "rapportannuel_2021_version_fr.pdf" },
    { y: 2020, mo: 7.8, pdf: D + "rapportannuel_2020_version_fr_lt.pdf" },
    { y: 2019, mo: 7, pdf: D + "rapportannuel_2019_fr.pdf" },
    { y: 2018, mo: 4.1, pdf: D + "rapportannuel_2018_word.pdf" },
    { y: 2017, mo: 6.8, pdf: D + "rapportannuel_2017.pdf" },
    { y: 2016, mo: 6.2, pdf: D + "rapportannuel_2016_fr_web.pdf" }
  ];
  // Couvertures en grand format extraites des PDF ; pour une nouvelle année, on prend l'aperçu du site
  const COUV_LOCALES = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2024, 2025];
  // En anglais, les rapports sont les éditions anglaises : on montre alors leur couverture donnée par le site
  let couvSite = false;
  const couverture = r => (couvSite && r.img) ? r.img : COUV_LOCALES.includes(r.y) ? `images/couv-${r.y}.jpg` : (r.img || "");
  const DL = `<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`;

  function render() {
    const [last, ...prev] = REPORTS;
    document.getElementById("latest").innerHTML = `
      <img src="${esc(couverture(last))}" alt="${T("Couverture du rapport annuel")} ${last.y}">
      <div>
        <div class="k">${T("Dernière édition")}</div>
        <div class="t">${T("Rapport annuel")} ${last.y}</div>
        <div class="s">PDF${last.mo ? " · " + Donnees.taille(last.mo) : ""}</div>
        <div class="btns">
          <a class="btn main" href="${esc(last.pdf)}" download>${DL}${T("Télécharger")}</a>
          <a class="btn alt" href="${esc(last.pdf)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>${T("Consulter")}</a>
        </div>
      </div>`;
    document.getElementById("grid").innerHTML = prev.map(r => `
      <a class="rep" href="${esc(r.pdf)}">
        <img src="${esc(couverture(r))}" alt="${T("Couverture du rapport annuel")} ${r.y}" loading="lazy">
        <div class="y">${r.y}</div>
        <div class="s">${DL}PDF${r.mo ? " · " + Donnees.taille(r.mo) : ""}</div>
      </a>`).join("");
  }
  render();

  // Rapports financiers (annuels et semestriels) : départ = page 1 du site, complété par data/contenus.json
  const F = "https://www.colorado.ma/corporate/sites/default/files/";
  let RF = [
    ["2026-09-25", "Semestriel", "Rapport financier semestriel 1S2026", "rapport_financier_semestriel_1s2026.pdf", "rapport_financier_semestriel_1s2026.png"],
    ["2026-04-09", "Annuel", "Rapport financier annuel 2025", "rapport_financier_annuel_2025.pdf", "image_rapport_2025.png"],
    ["2025-09-22", "Semestriel", "Rapport financier semestriel 1S2025", "rapport_financier_semestriel_au_30-06-2025_vf.pdf", "rapfin062025.jpg"],
    ["2025-04-28", "Annuel", "Rapport financier annuel 2024", "rfa_2024_colorado.pdf", "ig_rfa_2024.png"],
    ["2024-09-27", "Semestriel", "Rapport financier semestriel 1S2024", "rapport_financier_1s_2024.pdf", "img_rf_s1_24.png"],
    ["2024-04-26", "Annuel", "Rapport financier annuel 2023", "rapport_financier_annuel_2023.pdf", "ig_rfa23.png"],
    ["2023-09-27", "Semestriel", "Rapport financier semestriel 1S2023", "rf_s1-2023_vf.pdf", "img_rf-1s23.png"],
    ["2023-04-20", "Annuel", "Rapport financier annuel 2022", "rapport_financier_2022.pdf", "rfa_2022.png"],
    ["2022-09-30", "Semestriel", "Rapport financier semestriel 1S2022", "rf_s1-2022.pdf", "rf-1s22.png"],
    ["2022-04-22", "Annuel", "Rapport financier annuel 2021", "rapport_financier_annuel_2021.pdf", "im_rapp_fin_21.png"]
  ].map(([d, type, t, pdf, img]) => ({ d, type, t, pdf: F + pdf, img: F + img }));
  const PAR_LOT = 12;
  let typeRF = "Tous", visiblesRF = PAR_LOT;

  function renderRF() {
    const liste = RF.filter(r => typeRF === "Tous" || r.type === typeRF);
    document.getElementById("titreRF").textContent = T(typeRF === "Tous" ? "Rapports financiers" : `Rapports financiers ${typeRF === "Annuel" ? "annuels" : "semestriels"}`);
    document.getElementById("gridRF").innerHTML = liste.slice(0, visiblesRF).map(r => {
      // « 1er sem. 2026 » ou « 2025 » (titres français « …1S2026 » et anglais « … 1st half 2026 »)
      const an = (r.t.match(/\d{4}/g) || [""]).pop();
      const periode = r.type === "Semestriel" && an ? `${T("1er sem.")} ${an}` : an;
      return `<a class="rep" href="${esc(r.pdf)}">
        ${r.img ? `<img src="${esc(r.img)}" alt="${T("Aperçu :")} ${esc(r.t)}" loading="lazy">` : `<img alt="">`}
        <div class="y">${esc(periode)}</div>
        <div class="ty">${T(r.type === "Annuel" ? "Annuel" : "Semestriel")}</div>
        <div class="s">${DL}PDF${r.mo ? " · " + Donnees.taille(r.mo) : ""}</div>
      </a>`;
    }).join("");
    document.getElementById("moreRF").hidden = liste.length <= visiblesRF;
    document.getElementById("chipsRF").innerHTML = ["Tous", "Annuel", "Semestriel"].map(t =>
      `<button class="chip ${t === typeRF ? "on" : ""}" data-rf="${t}">${T(t === "Tous" ? "Tous" : t === "Annuel" ? "Annuels" : "Semestriels")}</button>`).join("");
  }
  document.addEventListener("click", e => { const c = e.target.closest("[data-rf]"); if (c) { typeRF = c.dataset.rf; visiblesRF = PAR_LOT; renderRF(); } });
  document.getElementById("moreRF").onclick = () => { visiblesRF += PAR_LOT; renderRF(); };
  renderRF();

  Donnees.charger().then(d => {
    const rapports = Donnees.champ(d, "rapports"), etats = Donnees.champ(d, "etatsFinanciers");
    if (rapports?.length) {
      couvSite = rapports === d.rapports_en;
      REPORTS = rapports.map(r => ({ y: r.annee, mo: r.taille, pdf: r.pdf, img: r.apercu }));
      render();
    }
    if (etats?.length) {
      // Type ramené à « Annuel » ou « Semestriel » (le fichier anglais dit « Annual » ou « Half-year »)
      RF = etats.map(r => ({ d: r.date, type: /semest|half/i.test(r.type) ? "Semestriel" : "Annuel", t: r.titre, pdf: r.pdf, img: r.apercu, mo: r.taille }));
      renderRF();
    }
  });

  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === b.dataset.p));
  });
</script>
</body>
</html>
