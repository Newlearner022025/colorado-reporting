<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="images/icone-192.png">
<link rel="apple-touch-icon" href="images/icone-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colorado">
<title>Maquette 3 – Actualités</title>
<style>
  :root { --ink: #1f2329; --muted: #6b7280; --line: #e5e7eb; --red: #b5121b; --bg: #ffffff; --soft: #f5f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); padding-bottom: 76px; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; position: sticky; top: 0; background: rgba(255,255,255,.97); z-index: 5; border-bottom: 1px solid var(--line); }
  header img { height: 40px; }
  header .hello { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.3; }
  header .hello b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .ic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
  .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  section { padding: 18px 20px 0; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .search { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 0 12px; height: 42px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
  .search svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .search input { flex: 1; border: none; background: none; font: inherit; font-size: 14px; outline: none; color: var(--ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .chip { flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 13px; border-radius: 20px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* À la une : la plus récente */
  .feature { display: block; margin-top: 18px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  /* Images entières (contain) : les visuels du site sont souvent des affiches avec du texte */
  .feature .img { height: 190px; background: var(--soft) center / contain no-repeat; position: relative; }
  .feature .img span { position: absolute; left: 12px; top: 12px; background: var(--red); color: #fff; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; }
  .feature .body { padding: 14px; }
  .k { font-size: 10px; color: var(--red); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
  .feature .t { font-size: 17px; font-weight: 600; line-height: 1.35; margin-top: 4px; }
  .feature .x { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .d { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .month { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 22px 0 4px; font-weight: 600; }
  .news { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .news .img { width: 96px; height: 72px; border-radius: 4px; flex-shrink: 0; background: var(--soft) center / contain no-repeat; }
  .news .t { font-size: 14px; font-weight: 500; line-height: 1.35; margin-top: 3px; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; display: none; }
  .more { display: block; width: 100%; text-align: center; margin: 18px 0 0; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 14px; color: var(--red); font-weight: 500; cursor: pointer; }
  .more[hidden] { display: none; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 5; }
  nav a { flex: 1; text-align: center; padding: 9px 0 12px; font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  nav svg { display: block; margin: 0 auto 3px; width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav a.on { color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <a href="01-demarrage.html" title="Revenir à l'écran de démarrage"><img src="https://www.colorado.ma/corporate/sites/default/files/logo_soyezinspires_02.png" alt="Colorado"></a>
    <div class="hello">Espace Corporate<b>Actualités</b></div>
  </header>

  <section>
    <h1>Actualités</h1>
    <div class="sub">Toute l'actualité de la société</div>

    <label class="search" id="recherche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Rechercher une actualité"></label>
    <div class="chips" id="chips"></div>

    <div id="list"></div>
    <div class="empty" id="empty">Aucune actualité ne correspond à votre recherche.</div>
    <button class="more" id="more" hidden>Voir plus d'actualités</button>
  </section>

  <nav>
    <a href="02-accueil.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>Accueil</a>
    <a class="on" href="03-actualites.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Actualités</a>
    <a href="04-rapports.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>Rapports</a>
    <a href="05-communiques.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Communiqués</a>
    <a href="06-contact.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>Contact</a>
  </nav>
</div>
<script src="donnees.js"></script>
<script>
  // Contenus de départ, remplacés par data/contenus.json dès qu'il est chargé
  const F = "https://www.colorado.ma/corporate/sites/default/files/";
  const esc = Donnees.esc;
  let NEWS = [
    { d: "2026-09-25", k: "Finance", t: "Communication financière semestrielle au 30-06-2026", x: "Publication des résultats du premier semestre 2026 et du rapport financier semestriel.", img: "images/ra-financier.jpg" },
    { d: "2026-05-15", k: "Finance", t: "Communiqué post AGO du 15/05/2026", img: "images/ra-chiffres.jpg" },
    { d: "2024-07-20", k: "Entreprise", t: "Renouvellement de la convention de catégorisation fiscale avec la DGI", img: F + "photos/screenshot_2025-04-16_at_10.20.37.png" },
    { d: "2024-07-08", k: "Certifications", t: "Renouvellement des certifications ISO", img: F + "photos/screenshot_2025-04-16_at_10.14.21.png" },
    { d: "2024-05-16", k: "Événements", t: "Participation au Forum International de la Chimie", img: F + "photos/screenshot_2025-04-16_at_10.16.07.png" },
    { d: "2024-04-16", k: "Entreprise", t: "Réaménagement du site de Dar Bouazza", img: F + "photos/screenshot_2025-04-16_at_10.23.51.png" },
    { d: "2024-03-01", k: "Gouvernance", t: "Nomination de M. Chagar en tant que PDG", img: F + "photos/screenshot_2025-04-16_at_10.12.04.png" },
    { d: "2023-04-10", k: "Certifications", t: "Certification HQE (Haute Qualité Environnementale)", img: F + "photos/screenshot_2025-04-16_at_10.06.32.png" },
    { d: "2023-03-10", k: "Entreprise", t: "Amélioration continue", img: F + "photos/screenshot_2025-04-16_at_10.02.27.png" },
    { d: "2023-02-16", k: "Certifications", t: "Renouvellement des certifications ISO", img: F + "photos/screenshot_2025-04-16_at_09.57.47.png" },
    { d: "2022-12-22", k: "Certifications", t: "COLORADO certifiée ISO 27001", img: F + "photos/iso_27001_c2_modif_5_x.jpg" },
    { d: "2022-08-31", k: "Certifications", t: "Renouvellement des certifications QSE", img: F + "styles/sidebar_actualite_thumbnail/public/photos/iso_0_0.jpg?itok=WXBAu3wu" }
  ];
  const fmt = (s, o) => new Date(s).toLocaleDateString("fr-FR", o);
  const PAR_LOT = 12;
  let cat = "Toutes", visibles = PAR_LOT;

  function render() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const items = NEWS.filter(n => (cat === "Toutes" || n.k === cat) && (n.t + " " + (n.x || "")).toLowerCase().includes(q));
    document.getElementById("more").hidden = items.length <= visibles;
    let html = "", month = "";
    items.slice(0, visibles).forEach((n, i) => {
      const lien = esc(n.lien || "#"), img = esc(n.img || "");
      if (i === 0 && !q && cat === "Toutes") {
        html += `<a class="feature" href="${lien}"><div class="img" style="background-image:url('${img}')"><span>À la une</span></div>
          <div class="body"><div class="k">${esc(n.k)}</div><div class="t">${esc(n.t)}</div>${n.x ? `<div class="x">${esc(n.x)}</div>` : ""}<div class="d">${fmt(n.d, { day: "numeric", month: "long", year: "numeric" })}</div></div></a>`;
        return;
      }
      const m = fmt(n.d, { month: "long", year: "numeric" });
      if (m !== month) { html += `<div class="month">${m}</div>`; month = m; }
      html += `<a class="news" href="${lien}"><div class="img" style="background-image:url('${img}')"></div>
        <div><div class="k">${esc(n.k)}</div><div class="t">${esc(n.t)}</div><div class="d">${fmt(n.d, { day: "numeric", month: "long", year: "numeric" })}</div></div></a>`;
    });
    document.getElementById("list").innerHTML = html;
    document.getElementById("empty").style.display = items.length ? "none" : "block";
    const cats = ["Toutes", ...new Set(NEWS.map(n => n.k))];
    document.getElementById("chips").innerHTML = cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  }
  document.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (c) { cat = c.dataset.c; visibles = PAR_LOT; render(); } });
  document.getElementById("q").addEventListener("input", () => { visibles = PAR_LOT; render(); });
  document.getElementById("more").onclick = () => { visibles += PAR_LOT; render(); };
  // Arrivée depuis la loupe de l'accueil : on place le curseur dans la recherche
  if (location.hash === "#recherche") document.getElementById("q").focus();
  render();

  Donnees.charger().then(d => {
    if (!d?.actualites?.length) return;
    NEWS = d.actualites.filter(a => a.date).map(a => ({ d: a.date, k: a.categorie, t: a.titre, x: a.extrait, img: a.image, lien: a.lien }));
    render();
  });
</script>
</body>
</html>
